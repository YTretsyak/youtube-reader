# One-command local stack. See docs/specification.md section 9.
# `mongo` and `rabbitmq` run today (back integration tests and local `dotnet run`).
# Uncomment `transcript-service` at M4, `api` at M5, and `web` at M6, once their
# Dockerfiles exist, to make `docker compose up` bring up the whole app.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  transcript-service:
    build:
      context: .
      dockerfile: src/TranscriptService/Dockerfile
    restart: unless-stopped
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
    # scale the fragile fetch layer under load:
    # docker compose up --scale transcript-service=3

  # api:
  #   build:
  #     context: .
  #     dockerfile: src/Api/Dockerfile
  #   restart: unless-stopped
  #   depends_on:
  #     - mongo
  #     - rabbitmq
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     MONGO_CONNECTION_STRING: mongodb://mongo:27017
  #     RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
  #     LLM_BASE_URL: ${LLM_BASE_URL}
  #     LLM_API_KEY: ${LLM_API_KEY}
  #     LLM_MODEL: ${LLM_MODEL}

  # web:
  #   build:
  #     context: ./web
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   depends_on:
  #     - api
  #   ports:
  #     - "3000:3000"

volumes:
  mongo-data:
  rabbitmq-data:
